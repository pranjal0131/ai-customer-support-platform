[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "supportiq"
version = "1.0.0"
description = "AI customer support intelligence platform"
requires-python = ">=3.11,<3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --disable-warnings --maxfail=1 --basetemp=.pytest-tmp"
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["data", "models", "frontend"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"

[tool.coverage.run]
source = ["backend", "ml"]
omit = ["ml/scripts/finetune_*.py"]
